<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gobble Dash: Escape Before Dinner</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1f2a; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Gobble Dash: Tilly the turkey runs 1000 metres to Freedom Forest before Thanksgiving dinner, jumping hay bales and fences, sliding under the carving knife, dashing past the oven, while Farmer Bram chases from behind"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
